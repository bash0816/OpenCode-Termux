name: npm Package

on:
  pull_request:
    paths:
      - 'bin/**'
      - 'lib/**'
      - 'config/**'
      - '!config/opencode-candidate-version.json'
      - 'scripts/**'
      - 'test/**'
      - 'package.json'
      - 'README.md'
      - 'NOTICE.md'
      - '.github/workflows/npm-package.yml'
  push:
    branches:
      - main
    paths:
      - 'bin/**'
      - 'lib/**'
      - 'config/**'
      - '!config/opencode-candidate-version.json'
      - 'scripts/**'
      - 'test/**'
      - 'package.json'
      - 'README.md'
      - 'NOTICE.md'
      - '.github/workflows/npm-package.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'publish-candidate'
        type: choice
        options:
          - 'publish-candidate'
          - 'promote-to-latest'
      expected_version:
        description: 'Candidate version to promote (e.g. 1.1.26). Required for promote-to-latest; ignored for publish-candidate.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch' || inputs.action == 'publish-candidate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check
        run: |
          set -euo pipefail
          node --check bin/opencode-termux
          node --check lib/downloader.js
          node --check lib/patcher.js
          node --check lib/setup.js
          node --check lib/version-utils.js
          node --check lib/argv-route.js
          node --check lib/self-update.js
          node --check scripts/prepare-opencode-candidate.js
          node --check scripts/promote-opencode-candidate.js
          node --test test/*.test.js

      - name: Publish preflight check
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');

          // Check package version against the pinned upstream version.
          const pkg = require('./package.json');
          const verified = require('./config/opencode-verified-versions.json');
          if (pkg.version !== verified.version) {
            throw new Error(`Version mismatch: package.json (${pkg.version}) != verified version (${verified.version})`);
          }
          console.log(`✓ Version match: ${verified.version}`);
          if (!verified.integrity || typeof verified.integrity !== 'string' || !verified.integrity.trim()) {
            throw new Error('Missing or empty integrity in verified config');
          }
          console.log('✓ npm integrity present');

          // Refuse to publish local test builds (release_state must be 'stable')
          if (verified.release_state !== 'stable') {
            throw new Error(`Refusing to publish: verified config release_state is '${verified.release_state}', expected 'stable'`);
          }
          console.log('✓ release_state is stable');

          NODE

      - name: Pack dry run
        run: npm pack --dry-run

  publish-candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'publish-candidate'
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish guard
        run: |
          set -euo pipefail
          node - <<'NODE'
          const { execSync } = require('child_process');
          const pkg = require('./package.json');
          const verified = require('./config/opencode-verified-versions.json');

          if (pkg.name !== '@bash0816/opencode-termux') throw new Error('unexpected package name');
          if (!pkg.version) throw new Error('missing version in package.json');
          if (verified.release_state !== 'stable') {
            throw new Error(`Refusing to publish: release_state is '${verified.release_state}', expected 'stable'`);
          }

          const packInfo = JSON.parse(execSync('npm pack --dry-run --json', { encoding: 'utf8' }));
          const pack = Array.isArray(packInfo) ? packInfo[0] : packInfo;
          const files = (pack.files || []).map(f => String(f.path || '').replace(/^\.\//, ''));
          const allowed = new Set(['package.json', 'README.md', 'LICENSE']);
          const unexpected = files.filter(f => {
            if (allowed.has(f)) return false;
            if (f.startsWith('bin/') || f.startsWith('lib/') || f.startsWith('config/')) return false;
            return true;
          });
          if (unexpected.length) {
            throw new Error(`unexpected files in npm pack: ${unexpected.join(', ')}`);
          }
          console.log('Pack OK, version:', pkg.version, 'files:', files);
          NODE

      - name: Publish as @candidate
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --tag candidate

      - name: Show dist-tags
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm dist-tag ls @bash0816/opencode-termux

  promote-to-latest:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'promote-to-latest'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
      actions: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Swap candidate → latest (old latest → candidate)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          CANDIDATE=$(npm view @bash0816/opencode-termux dist-tags.candidate)
          echo "candidate: $CANDIDATE"
          PREV_LATEST=$(npm view @bash0816/opencode-termux dist-tags.latest 2>/dev/null || echo "")
          echo "prev latest: ${PREV_LATEST:-none}"

          if [ -z "$CANDIDATE" ]; then
            echo "No @candidate tag found. Aborting."
            exit 1
          fi

          if [ -z "${EXPECTED_VERSION:-}" ]; then
            echo "expected_version is required for promote-to-latest. Aborting." >&2
            exit 1
          fi
          if [ "$CANDIDATE" != "$EXPECTED_VERSION" ]; then
            echo "Candidate version mismatch: expected '$EXPECTED_VERSION' but registry shows '$CANDIDATE'" >&2
            exit 1
          fi

          if [ -n "$PREV_LATEST" ] && [ "$PREV_LATEST" != "$CANDIDATE" ]; then
            npm dist-tag add @bash0816/opencode-termux@$PREV_LATEST candidate
            echo "Moved $PREV_LATEST → @candidate"
          fi

          npm dist-tag add @bash0816/opencode-termux@$CANDIDATE latest
          echo "Promoted $CANDIDATE → @latest"

          npm dist-tag ls @bash0816/opencode-termux

      - name: Dispatch release-finalize
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          ver="$EXPECTED_VERSION"
          gh workflow run release-finalize.yml \
            --repo "$GITHUB_REPOSITORY" \
            --field version="${ver}"
          echo "Dispatched release-finalize for ${ver}"
